# Fly.io app config for LicenseGuard's Django backend.
#
# One-time setup (run from this directory, after `flyctl auth login`):
#   flyctl apps create licenseguard-api            # pick a unique name if taken
#   flyctl postgres create --name licenseguard-db --region iad --vm-size shared-cpu-1x
#   flyctl postgres attach licenseguard-db -a licenseguard-api   # sets DATABASE_URL secret
#   flyctl redis create --name licenseguard-redis --region iad --no-replicas
#   flyctl secrets set -a licenseguard-api \
#     DJANGO_SECRET_KEY=... \
#     CREDENTIALS_ENCRYPTION_KEY=... \
#     CELERY_BROKER_URL=redis://.../0 \
#     CELERY_RESULT_BACKEND=redis://.../1 \
#     GOOGLE_OAUTH_CLIENT_ID=... \
#     GOOGLE_OAUTH_CLIENT_SECRET=...
#   flyctl deploy
#   flyctl scale count worker=1 beat=1 -a licenseguard-api

app = "licenseguard-api"
primary_region = "iad"

[build]

[processes]
  app = "gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
  worker = "celery -A config worker -l info"
  beat = "celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler"

[deploy]
  release_command = "python manage.py migrate --noinput"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[env]
  DJANGO_DEBUG = "False"
  DJANGO_ALLOWED_HOSTS = "licenseguard-api.fly.dev"
  CORS_ALLOWED_ORIGINS = "https://license-guard-omega.vercel.app"
  FRONTEND_URL = "https://license-guard-omega.vercel.app"
  EMAIL_BACKEND = "django.core.mail.backends.console.EmailBackend"
  DEFAULT_FROM_EMAIL = "LicenseGuard <alerts@licenseguard.local>"
  CONNECTORS_DEMO_MODE = "True"
