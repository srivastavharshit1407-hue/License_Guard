  #     - key: CELERY_RESULT_BACKEND
  #       fromService: { type: redis, name: licenseguard-redis, property: connectionString }
  #     - key: DATABASE_URL
  #       fromDatabase: { name: licenseguard-db, property: connectionString }
  #
  # - type: worker
  #   name: licenseguard-beat
  #   runtime: docker
  #   rootDir: licenseguard-backend
  #   dockerfilePath: ./Dockerfile
  #   dockerContext: .
  #   dockerCommand: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
  #   plan: starter
  #   envVars:
  #     - key: CELERY_BROKER_URL
  #       fromService: { type: redis, name: licenseguard-redis, property: connectionString }
  #     - key: CELERY_RESULT_BACKEND
  #       fromService: { type: redis, name: licenseguard-redis, property: connectionString }
  #     - key: DATABASE_URL
  #       fromDatabase: { name: licenseguard-db, property: connectionString }
  #
  # - type: redis
